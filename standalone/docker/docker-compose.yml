# Going Public Server - Docker template (Big Ambitions multiplayer server with web interface).
#   docker compose up -d --build
#   docker compose logs goingpublicserver                     the access data (shown once, at the first start)
#   docker compose exec goingpublicserver gps reset-password  a new password, shown in this terminal
# Then http://<this machine>:8080 - Installation: download the game with the Steam account that owns Big Ambitions,
# install Proton GE; Settings: choose or create a world; Overview: Start.
services:
  goingpublicserver:
    build:
      context: .
      args:
        GPS_VERSION: "1.0.16"
    image: goingpublicserver:1.0.16
    container_name: goingpublicserver
    restart: unless-stopped
    stop_grace_period: 5m        # the server saves before it ends
    ports:
      - "8080:8080/tcp"          # web interface - from the internet only behind HTTPS / a VPN
      - "7777:7777/udp"          # game port: the same as "Game Port" in the settings (HostPort)
    volumes:
      - ./data:/data             # game (about 7 GB), Proton, saves, settings, backups
    ulimits:
      nofile: 524288             # Wine / Proton (esync)
    environment:
      TZ: "Europe/Berlin"
      GPS_LANG: "de"             # language of the manager's texts: de / en
      PUID: "1000"               # owner of ./data
      PGID: "1000"
      # GPS_PUBLIC_URL: "http://192.168.1.20:8080"   # the address shown with the access data
