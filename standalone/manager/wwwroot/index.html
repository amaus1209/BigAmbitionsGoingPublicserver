<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Going Public Server</title>
<link rel="icon" href="/monitor/logo-640.jpg">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>

<div id="login" class="login" hidden>
  <form id="loginForm" class="card login-card" autocomplete="on">
    <img src="/monitor/logo-640.jpg" alt="Going Public Server" class="login-logo">
    <h1>Going Public Server</h1>
    <p class="muted small" data-t="loginHint"></p>
    <label><span data-t="user"></span><input id="lUser" name="username" autocomplete="username" required></label>
    <label><span data-t="password"></span><input id="lPass" name="password" type="password" autocomplete="current-password" required></label>
    <div id="lErr" class="err" role="alert"></div>
    <button class="btn primary" data-t="login"></button>
    <div class="lang-switch"><button type="button" class="link" data-lang></button></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="brand"><img src="/monitor/logo-640.jpg" alt=""><span>Going Public Server</span></div>
    <span id="topBadge" class="badge"><span class="dot"></span><span></span></span>
    <nav class="tabs" id="tabs">
      <button data-tab="dash" data-t="tDash"></button>
      <button data-tab="console" data-t="tConsole"></button>
      <button data-tab="settings" data-t="tSettings"></button>
      <button data-tab="players" data-t="tPlayers"></button>
      <button data-tab="install" data-t="tInstall"></button>
      <button data-tab="backups" data-t="tBackups"></button>
      <button data-tab="account" data-t="tAccount"></button>
    </nav>
    <div class="top-right"><button class="link" data-lang></button><button class="link" id="logout" data-t="logout"></button></div>
  </header>

  <main>
    <!-- overview -->
    <section id="tab-dash">
      <div class="card">
        <div class="hero">
          <div class="grow">
            <div class="hero-state"><span id="dDot" class="dot"></span><span id="dState"></span></div>
            <div id="dDetail" class="hero-detail"></div>
          </div>
          <div class="row">
            <button class="btn primary" id="bStart" data-t="start"></button>
            <button class="btn" id="bStop" data-t="stop"></button>
            <button class="btn" id="bRestart" data-t="restart"></button>
            <button class="btn" id="bSave" data-t="save"></button>
            <button class="btn danger" id="bKill" data-t="kill"></button>
          </div>
        </div>
      </div>
      <div class="tiles">
        <div class="tile"><div class="lbl" data-t="players"></div><div class="val" id="vPlayers"></div><div class="note" id="nPlayers"></div></div>
        <div class="tile"><div class="lbl" data-t="world"></div><div class="val" id="vWorld"></div><div class="note" id="nWorld"></div></div>
        <div class="tile"><div class="lbl" data-t="key"></div><div class="val mono" id="vKey"></div><div class="note"><button class="link" id="copyKey" data-t="copy"></button></div></div>
        <div class="tile"><div class="lbl" data-t="port"></div><div class="val" id="vPort"></div><div class="note" id="nPort"></div></div>
      </div>
      <div class="grid2">
        <div class="card" id="setupCard">
          <h2 data-t="setupTitle"></h2>
          <ol class="steps" id="steps"></ol>
        </div>
        <div class="card">
          <h2 data-t="joinTitle"></h2>
          <p id="joinHint"></p>
          <p class="small"><a id="rankLink" href="/monitor/index.html" target="_blank" rel="noopener" data-t="rankingLink"></a></p>
          <dl class="kv small">
            <dt data-t="modVersion"></dt><dd id="vMod"></dd>
            <dt data-t="uptime"></dt><dd id="vUptime"></dd>
            <dt data-t="gameDay"></dt><dd id="vDay"></dd>
          </dl>
        </div>
      </div>
      <div class="card">
        <div class="row"><h2 class="grow" data-t="recent"></h2><button class="link" data-goto="console" data-t="openConsole"></button></div>
        <div class="console short" id="miniConsole"></div>
      </div>
    </section>

    <!-- console -->
    <section id="tab-console" hidden>
      <div class="card">
        <div class="row">
          <h2 class="grow" data-t="tConsole"></h2>
          <label class="row small"><input type="checkbox" id="fGame" checked><span data-t="srcGame"></span></label>
          <label class="row small"><input type="checkbox" id="fManager" checked><span data-t="srcManager"></span></label>
          <label class="row small"><input type="checkbox" id="fJob" checked><span data-t="srcJob"></span></label>
          <label class="row small"><input type="checkbox" id="fScroll" checked><span data-t="autoscroll"></span></label>
        </div>
        <div class="console" id="console" tabindex="0"></div>
        <form class="cmdbar" id="cmdForm">
          <input id="cmdIn" autocomplete="off" spellcheck="false" data-tp="cmdPlaceholder">
          <button class="btn primary" data-t="send"></button>
        </form>
        <div class="chips" id="chips"></div>
      </div>
    </section>

    <!-- settings -->
    <section id="tab-settings" hidden>
      <div class="card">
        <h2 data-t="tSettings"></h2>
        <p class="muted small" data-t="settingsHint"></p>
        <div class="subtabs" id="setTabs"></div>
        <div id="setFields"></div>
      </div>
      <div class="savebar">
        <span id="setState" class="grow muted small"></span>
        <button class="btn" id="setReset" data-t="discard"></button>
        <button class="btn" id="setSave" data-t="saveSettings"></button>
        <button class="btn primary" id="setSaveRestart" data-t="saveRestart"></button>
      </div>
    </section>

    <!-- players -->
    <section id="tab-players" hidden>
      <div class="card">
        <h2 data-t="online"></h2>
        <div class="tbl"><table><tbody id="pOnline"></tbody></table></div>
      </div>
      <div class="card">
        <div class="row"><h2 class="grow" data-t="announce"></h2><span class="muted" id="restartLeft"></span></div>
        <form class="row" id="noticeForm"><input class="grow" id="noticeIn" maxlength="300" data-tp="noticePh" autocomplete="off"><button class="btn primary" data-t="announceBtn"></button>
          <button class="btn" type="button" id="bRestartIn" data-t="restartIn"></button><button class="btn" type="button" id="bRestartOff" data-t="restartOff" hidden></button></form>
      </div>
      <div class="card">
        <h2 data-t="chat"></h2>
        <div class="console short chatlog" id="chatLog"></div>
        <form class="row" id="chatForm"><select id="chatTo" style="width:auto"></select><input class="grow" id="chatIn" maxlength="500" data-tp="chatPh" autocomplete="off"><button class="btn primary" data-t="send"></button></form>
      </div>
      <div class="card">
        <div class="row"><h2 class="grow" data-t="bans"></h2><button class="btn small danger" id="bUnbanAll" data-t="unbanAll"></button></div>
        <div class="tbl"><table>
          <thead><tr><th data-t="user"></th><th data-t="bannedOn"></th><th data-t="reason"></th><th data-t="how"></th><th></th></tr></thead>
          <tbody id="pBans"></tbody>
        </table></div>
        <form class="row" id="banForm" style="margin-top:10px"><input class="grow" id="banIn" data-tp="banPh"><button class="btn danger" id="bBanName" type="submit" data-t="ban"></button><button class="btn" id="bUnbanName" type="button" data-t="unban"></button></form>
      </div>
      <div class="card">
        <h2 data-t="all"></h2>
        <div class="tbl"><table>
          <thead><tr><th data-t="user"></th><th class="num" data-t="hours"></th><th class="num" data-t="sessions"></th><th data-t="firstSeen"></th><th data-t="lastSeen"></th></tr></thead>
          <tbody id="pAll"></tbody>
        </table></div>
      </div>
    </section>

    <!-- installation -->
    <section id="tab-install" hidden>
      <div class="card job" id="jobCard" hidden>
        <div class="row"><h3 class="grow" id="jobTitle"></h3><span class="badge" id="jobState"></span></div>
        <div id="jobMsg"></div>
        <div class="bar" id="jobBar"><i></i></div>
        <div class="console short" id="jobLines"></div>
      </div>
      <div class="grid2">
        <div class="card">
          <h2 data-t="gameCard"></h2>
          <dl class="kv"><dt data-t="state"></dt><dd id="iGame"></dd><dt>SteamCMD</dt><dd id="iSteamcmd"></dd></dl>
          <form class="stack" id="gameForm" autocomplete="off">
            <label><span data-t="steamUser"></span><input id="gUser" autocomplete="off" spellcheck="false"></label>
            <label><span data-t="steamPass"></span><input id="gPass" type="password" autocomplete="new-password"><span class="small muted" data-t="steamPassHint"></span></label>
            <label id="gCodeRow"><span data-t="guard"></span><input id="gCode" autocomplete="one-time-code" spellcheck="false"><span class="small muted" data-t="guardHint"></span></label>
            <div><button class="btn primary" data-t="installGame"></button></div>
          </form>
          <p class="small muted" data-t="steamNote"></p>
        </div>
        <div class="stack">
          <div class="card" id="protonCard">
            <h2 data-t="protonCard"></h2>
            <dl class="kv"><dt data-t="installed"></dt><dd id="iProton"></dd></dl>
            <form class="row" id="protonForm"><input class="grow" id="pVersion" data-tp="protonPh"><button class="btn" data-t="installProton"></button></form>
            <p class="small muted" data-t="protonNote"></p>
          </div>
          <div class="card">
            <h2 data-t="filesCard"></h2>
            <dl class="kv">
              <dt data-t="installed"></dt><dd id="iFiles"></dd>
              <dt data-t="filesPackage"></dt><dd id="iPackage"></dd>
              <dt data-t="filesLatest"></dt><dd id="iLatest"></dd>
            </dl>
            <div class="row"><button class="btn" id="bUpdateFiles" data-t="updateFiles"></button><button class="link" id="bCheck" data-t="checkUpdates"></button></div>
            <p class="small muted" data-t="filesNote"></p>
          </div>
          <div class="card">
            <h2 data-t="modsCard"></h2>
            <p id="iMods"></p>
            <p class="small muted" id="iModsNote"></p>
          </div>
        </div>
      </div>
    </section>

    <!-- backups -->
    <section id="tab-backups" hidden>
      <div class="card">
        <div class="row"><h2 class="grow" data-t="backupsTitle"></h2><button class="btn primary" id="bBackup" data-t="backupNow"></button></div>
        <div class="tbl"><table>
          <thead><tr><th data-t="date"></th><th data-t="file"></th><th class="num" data-t="size"></th><th></th></tr></thead>
          <tbody id="bList"></tbody>
        </table></div>
      </div>
      <div class="card">
        <h3 data-t="schedule"></h3>
        <form class="row" id="schedForm">
          <label class="grow"><span data-t="backupHour"></span><select id="bHour"></select></label>
          <label class="grow"><span data-t="keep"></span><input id="bKeep" type="number" min="1" max="365"></label>
          <button class="btn" data-t="apply"></button>
        </form>
      </div>
    </section>

    <!-- account -->
    <section id="tab-account" hidden>
      <div class="grid2">
        <div class="card">
          <h2 data-t="pwTitle"></h2>
          <form class="stack" id="pwForm" autocomplete="on">
            <input type="text" name="username" autocomplete="username" id="pwUser" hidden>
            <label><span data-t="pwCurrent"></span><input id="pwCur" type="password" autocomplete="current-password" required></label>
            <label><span data-t="pwNew"></span><input id="pwNew" type="password" autocomplete="new-password" minlength="10" required></label>
            <label><span data-t="pwRepeat"></span><input id="pwRep" type="password" autocomplete="new-password" minlength="10" required></label>
            <div id="pwErr" class="err" role="alert"></div>
            <div><button class="btn primary" data-t="pwChange"></button></div>
          </form>
        </div>
        <div class="card">
          <h2 data-t="mgrTitle"></h2>
          <form class="stack" id="mgrForm">
            <div class="row">
              <label class="grow"><span data-t="webPort"></span><input id="mPort" type="number" min="1" max="65535"></label>
              <label class="grow"><span data-t="webBind"></span><input id="mBind" spellcheck="false"></label>
            </div>
            <label class="row"><input type="checkbox" id="mAuto"><span data-t="autoStart"></span></label>
            <label><span data-t="langLabel"></span><select id="mLang"><option value="" data-t="langAuto"></option><option value="de">Deutsch</option><option value="en">English</option></select></label>
            <p class="small muted" data-t="mgrRestartNote"></p>
            <div><button class="btn" data-t="apply"></button></div>
          </form>
        </div>
      </div>
      <div class="card">
        <h2 data-t="logsTitle"></h2>
        <div class="row" id="logLinks"></div>
        <p class="small muted" id="about"></p>
      </div>
    </section>
  </main>
</div>

<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
