# Checks uploaded translation tables and renews ModTranslations/index.json (version + checksums), which the Going Public
# Server mod reads to fetch new translations. Runs after every upload to ModTranslations/ (and by hand under Actions).
# A table with broken placeholders stops it with a red X that names the line; nothing reaches the players then.
name: Translations

on:
  push:
    branches: [main]
    paths: ["ModTranslations/**", "tools/modtr-index.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check translations and renew the index
        run: python3 tools/modtr-index.py ModTranslations
      - name: Commit the index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add ModTranslations/index.json
          git diff --cached --quiet && exit 0
          git commit -m "Translation index"
          git push
