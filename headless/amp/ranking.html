<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Going Public Server – Ranking</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --axis:#3d4350; --text:#e8e8ea; --muted:#9aa0ab; --gold:#e3b34a; --ok:#4cc38a;
          --s-in:#3987e5; --s-out:#d95926; --s-fps:#199e70; --warn:#fab219; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:1000px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:26px; margin:0 0 4px; } h1 span { color:var(--gold); }
  .sub { color:var(--muted); margin:0 0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow-x:auto; }
  table { border-collapse:collapse; width:100%; }
  #tbl table { min-width:720px; }
  th, td { padding:10px 12px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--line); }
  #tbl th:nth-child(-n+2), #tbl td:nth-child(-n+2) { text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  #tbl th { cursor:pointer; user-select:none; }
  th.on { color:var(--gold); } th.on::after { content:" ▾"; } th.on.asc::after { content:" ▴"; }
  tr:last-child td { border-bottom:none; }
  td.rank { color:var(--muted); width:36px; } tr:nth-child(1) td.rank, tr:nth-child(2) td.rank, tr:nth-child(3) td.rank { color:var(--gold); font-weight:700; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:6px; }
  .links { margin:14px 0 0; color:var(--muted); font-size:14px; } .links a { color:var(--gold); margin-right:14px; }
  .lang { float:right; color:var(--muted); font-size:14px; cursor:pointer; text-decoration:underline; }
  .empty { padding:24px; color:var(--muted); }
  .merged { display:block; color:var(--muted); font-size:12px; }
  /* GOING-ONLINE-RANK-1: the players' cable providers (module 8) */
  .prov { display:block; color:var(--gold); font-size:12px; }
  .badge { display:inline-block; margin-left:6px; padding:0 6px; border-radius:8px; background:var(--gold); color:#111; font-size:11px; font-weight:700; }
  /* NET-PAGE-1: the server's numbers (net.json) */
  h2 { font-size:20px; margin:36px 0 2px; }
  .tiles { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin:0 0 12px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .tile .lbl { color:var(--muted); font-size:13px; }
  .tile .val { font-size:24px; font-weight:600; line-height:1.35; }
  .tile .note { color:var(--muted); font-size:12px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px 8px; margin:0 0 12px; min-width:0; }
  .pair { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:12px; margin:0 0 12px; } .pair .panel { margin:0; }
  .ph { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .ph h3 { margin:0; font-size:15px; } .ph .unit { color:var(--muted); font-size:13px; }
  .legend { display:flex; flex-wrap:wrap; gap:4px 18px; color:var(--muted); font-size:13px; margin:4px 0 0; }
  .legend b { color:var(--text); font-weight:600; margin-left:4px; }
  .key { display:inline-block; width:14px; height:2px; border-radius:1px; vertical-align:middle; margin-right:6px; }
  .plot { position:relative; margin-top:6px; }
  .plot svg { display:block; width:100%; height:auto; overflow:visible; }
  .plot svg:focus { outline:none; } .plot svg:focus-visible { outline:2px solid var(--gold); outline-offset:3px; border-radius:4px; }
  .plot text { fill:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; }
  .plot text.lbl { fill:var(--text); font-weight:600; }
  .tip { position:absolute; top:8px; pointer-events:none; background:#0b0d11; border:1px solid var(--line); border-radius:8px;
         padding:8px 10px; font-size:13px; line-height:1.5; white-space:nowrap; z-index:2; }
  .tip .tt { color:var(--muted); font-size:12px; } .tip b { font-weight:600; margin-right:4px; } .tip span { color:var(--muted); }
  .srv h3.cap { margin:0; padding:14px 12px 2px; font-size:15px; }
  .srv th { cursor:default; }
  .srv th:first-child, .srv td:first-child { text-align:left; }
  .srv td { font-variant-numeric:tabular-nums; }
  #mTbl table { min-width:640px; }
  .fine { color:var(--muted); font-size:12px; margin:0; padding:10px 12px 14px; }
  .thr { margin-left:8px; white-space:nowrap; } .thr svg { vertical-align:-1px; margin-right:4px; }
  .tblBtn { background:none; border:1px solid var(--line); color:var(--gold); border-radius:6px; padding:7px 12px; font:inherit; font-size:14px; cursor:pointer; margin:0 0 12px; }
  /* BUILDING-LIST-1: the players' buildings (buildings.json) */
  #bTbl table { min-width:560px; } #bTbl th, #bTbl td { text-align:left; } #bTbl th { cursor:pointer; user-select:none; }
  /* ADMIN-1: the admin part (AMP login) */
  main.adminView > :not(#admin):not(.lang):not(img) { display:none !important; }
  main:not(.adminView) #admin { display:none !important; }
  #admin .panel { padding:14px 16px; }
  #admin h3 { margin:0 0 8px; font-size:15px; }
  #admin input, #admin select { padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:#0b0d11; color:var(--text); font:inherit; font-size:14px; }
  .abtn { background:none; border:1px solid var(--line); color:var(--gold); border-radius:6px; padding:5px 10px; font:inherit; font-size:13px; cursor:pointer; margin:2px 0 2px 6px; }
  .abtn.main { background:var(--gold); color:#111; border-color:var(--gold); font-weight:700; padding:8px 14px; margin-left:0; }
  .abtn.bad { color:#e57373; }
  #admin td, #admin th { text-align:left; white-space:normal; }
  #admin td.act { text-align:right; white-space:nowrap; }
  .chatlog { height:260px; overflow-y:auto; background:#0b0d11; border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin:0 0 8px; font-size:14px; }
  .chatlog div { margin:0 0 2px; overflow-wrap:anywhere; } .chatlog .tm { color:var(--muted); margin-right:6px; } .chatlog .who { color:var(--gold); margin-right:4px; }
  .chatrow { display:flex; gap:6px; flex-wrap:wrap; } .chatrow input { flex:1 1 200px; min-width:0; }
  .replies { color:var(--muted); font-size:12px; max-height:90px; overflow-y:auto; margin:6px 0 0; overflow-wrap:anywhere; }
  .aerr { color:#e57373; margin-top:8px; min-height:1em; }
  @media (max-width:760px) { .pair { grid-template-columns:minmax(0, 1fr); } .tiles { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  @media (max-width:520px) { .srv td { padding:10px 6px; font-size:14px; } .srv th { padding:10px 6px; font-size:12px; } .srv th:first-child, .srv td:first-child { padding-left:12px; }
    .srv th:last-child, .srv td:last-child { padding-right:12px; } .thr { display:block; margin:0; font-size:12px; } }
</style>
</head>
<body>
<main>
  <span class="lang" id="lang"></span>
  <span class="lang" id="adm" style="margin-right:16px" hidden></span>
  <img src="logo-640.jpg?v=1" alt="Going Public Server" style="display:block;width:100%;max-width:420px;height:auto;margin:6px auto 18px;border-radius:12px">
  <h1 data-t="title"></h1>
  <p class="sub" id="sub"></p>
  <form id="login" class="card" style="padding:18px 20px;margin:0 0 16px" hidden>
    <label for="keyIn" data-t="k_label"></label><br>
    <input id="keyIn" autocomplete="off" style="margin:8px 8px 0 0;padding:8px 10px;border-radius:6px;border:1px solid var(--line);background:#0b0d11;color:var(--text)">
    <button style="padding:8px 14px;border-radius:6px;border:0;background:var(--gold);font-weight:700" data-t="k_btn"></button>
    <div id="keyErr" style="color:#e57373;margin-top:8px"></div>
  </form>
  <div class="card" id="tbl" hidden><table>
    <thead><tr>
      <th data-k="rank">#</th><th data-k="name" data-t="c_name"></th><th data-k="hours" data-t="c_hours"></th>
      <th data-k="sessions" data-t="c_sessions"></th><th data-k="cash" data-t="c_cash"></th>
      <th data-k="businesses" data-t="c_biz"></th><th data-k="buildings" data-t="c_bld"></th>
      <th data-k="firstSeen" data-t="c_first"></th><th data-k="lastSeen" data-t="c_last"></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <p class="links" data-t="l_join"></p>
  <p class="links" id="admRow" hidden><a href="#admin" id="admLink" data-t="a_link_long"></a></p>
  <section id="provs" hidden>
    <h2 data-t="pv_title"></h2>
    <p class="sub" id="pvSub"></p>
    <div class="card" id="pvTbl"></div>
  </section>
  <section id="blds" hidden>
    <h2 data-t="b_title"></h2>
    <p class="sub" id="bSub"></p>
    <div class="card" id="bTbl"></div>
  </section>
  <section class="srv" id="srv" hidden>
    <h2 data-t="s_title"></h2>
    <p class="sub" id="srvSub"></p>
    <div class="tiles">
      <div class="tile"><div class="lbl" data-t="t_rate"></div><div class="val" id="vRate"></div><div class="note" id="nRate"></div></div>
      <div class="tile"><div class="lbl" data-t="t_conn"></div><div class="val" id="vConn"></div><div class="note" id="nConn"></div></div>
      <div class="tile"><div class="lbl" data-t="t_thr"></div><div class="val" id="vThr"></div><div class="note" id="nThr"></div></div>
      <div class="tile"><div class="lbl" data-t="t_fps"></div><div class="val" id="vFps"></div><div class="note" id="nFps"></div></div>
    </div>
    <div class="panel" id="cNet"></div>
    <div class="pair"><div class="panel" id="cMsg"></div><div class="panel" id="cFps"></div></div>
    <div class="card" id="pTbl" style="margin:0 0 12px"></div>
    <button class="tblBtn" id="tblBtn" type="button"></button>
    <div class="card" id="mTbl" hidden></div>
  </section>
  <section id="admin">
    <h1 data-t="a_title"></h1>
    <form id="aLogin" class="panel" style="margin:0 0 16px">
      <p class="sub" style="margin:0 0 10px" data-t="a_note"></p>
      <input id="aUser" autocomplete="username" style="margin:0 6px 6px 0">
      <input id="aPass" type="password" autocomplete="current-password" style="margin:0 6px 6px 0">
      <input id="aCode" autocomplete="one-time-code" inputmode="numeric" style="margin:0 6px 6px 0;width:110px" hidden>
      <button class="abtn main" data-t="a_in"></button>
      <div class="aerr" id="aErr"></div>
    </form>
    <div id="aPanel" hidden>
      <div class="panel" style="margin:0 0 12px">
        <div class="ph"><h3 data-t="a_server"></h3><span>
          <button class="abtn" type="button" id="aSave" data-t="a_save"></button>
          <button class="abtn bad" type="button" id="aRestart" data-t="a_restart"></button>
          <button class="abtn" type="button" id="aRestartOff" data-t="a_restart_off" hidden></button>
          <button class="abtn" type="button" id="aOut" data-t="a_out"></button></span></div>
        <div id="aStatus" class="sub" style="margin:0"></div>
        <form class="chatrow" id="aNoticeForm" style="margin-top:8px"><input id="aNotice" maxlength="300" autocomplete="off"><button class="abtn main" data-t="a_notice"></button></form>
        <div class="replies" id="aReplies"></div>
      </div>
      <div class="card" style="margin:0 0 12px"><div style="padding:14px 16px 4px"><h3 data-t="a_players"></h3></div><table><tbody id="aPlayers"></tbody></table></div>
      <div class="panel" style="margin:0 0 12px">
        <h3 data-t="a_chat"></h3>
        <div class="chatlog" id="aChat"></div>
        <form class="chatrow" id="aChatForm"><select id="aTo"></select><input id="aText" maxlength="500" autocomplete="off"><button class="abtn main" data-t="a_send"></button></form>
      </div>
      <div class="card" style="margin:0 0 12px"><div class="ph" style="padding:14px 16px 4px"><h3 data-t="a_bans"></h3><button class="abtn bad" type="button" id="aUnbanAll" data-t="a_unban_all"></button></div>
        <table><thead><tr><th data-t="c_name"></th><th data-t="a_since"></th><th data-t="a_reason"></th><th data-t="a_how"></th><th></th></tr></thead><tbody id="aBans"></tbody></table></div>
    </div>
    <p class="links"><a href="#" id="aBack" data-t="a_back"></a></p>
  </section>
</main>

// One line chart of the last hour. series: [sample index, name key, colour token]; a gap of more than 2.5 readings

function drawChart(id, title, unit, short, digits, series, minTop, whole, H) {
  const box = document.getElementById(id), L = T[lang], prev = charts[id];
  if (!box.firstChild) {

  }

    series.forEach(([, , c], n) => { g += `<circle cx="${X(end[0]).toFixed(1)}" cy="${ys[n].toFixed(1)}" r="4" style="fill:var(${c});stroke:var(--card);stroke-width:2"/>`; });
    if (two && Math.abs(ys[0] - ys[1]) >= 14)
      series.forEach(([, k], n) => { g += `<text class="lbl" x="${(X(end[0]) + 9).toFixed(1)}" y="${(ys[n] + 4).toFixed(1)}">${esc(L[k])}</text>`; });
  } else g += `<text x="${(m.l + pw / 2).toFixed(1)}" y="${(m.t + ph / 2).toFixed(1)}" text-anchor="middle">${esc(L.s_wait)}</text>`;

  box.querySelector(".legend").innerHTML = two
    ? series.map(([i, k, c]) => `<span><i class="key" style="background:var(${c})"></i>${esc(L[k])}<b>${end ? fix(end[i], digits) : "—"}</b>${end ? esc(short) : ""}</span>`).join("")
    : `<span>${esc(L.now)}<b>${end ? fix(end[series[0][0]], digits) : "—"}</b>${end ? esc(short) : ""}</span>`;
  charts[id] = { pts, X, Y, series, m, W, ph, digits, short, idx: -1 };
  if (prev && prev.idx >= 0 && pts.length) {   // a refresh keeps the crosshair on the same moment
    const t = prev.pts[prev.idx][0];
    let k = 0; pts.forEach((s, n) => { if (Math.abs(s[0] - t) < Math.abs(pts[k][0] - t)) k = n; });

}
function hookChart(id) {
  const box = document.getElementById(id), svg = box.querySelector("svg");
  const nearest = ev => {
    const st = charts[id]; if (!st || !st.pts.length) return -1;
    const r = svg.getBoundingClientRect(), x = (ev.clientX - r.left) * st.W / r.width;
    let k = 0; st.pts.forEach((s, n) => { if (Math.abs(st.X(s[0]) - x) < Math.abs(st.X(st.pts[k][0]) - x)) k = n; });
    return k;
  };
  svg.addEventListener("pointermove", ev => showAt(id, nearest(ev)));
  svg.addEventListener("pointerleave", () => hideAt(id));
  svg.addEventListener("focus", () => { const st = charts[id]; if (st && st.pts.length) showAt(id, st.idx >= 0 ? st.idx : st.pts.length - 1); });
  svg.addEventListener("blur", () => hideAt(id));
  svg.addEventListener("keydown", ev => {
    const st = charts[id]; if (!st || !st.pts.length) return;
    let k = st.idx >= 0 ? st.idx : st.pts.length - 1;
    if (ev.key === "ArrowLeft") k = Math.max(0, k - 1);
    else if (ev.key === "ArrowRight") k = Math.min(st.pts.length - 1, k + 1);
    else if (ev.key === "Home") k = 0;
    else if (ev.key === "End") k = st.pts.length - 1;
    else if (ev.key === "Escape") { hideAt(id); return; }
    else return;
    ev.preventDefault(); showAt(id, k);
  });
}

    + st.series.map(([i, , c]) => `<circle cx="${x}" cy="${st.Y(s[i]).toFixed(1)}" r="4" style="fill:var(${c});stroke:var(--card);stroke-width:2"/>`).join("");
  const tip = box.querySelector(".tip");
  tip.textContent = "";
  const line = (cls, text) => { const d = document.createElement("div"); if (cls) d.className = cls; if (text) d.textContent = text; tip.appendChild(d); return d; };
  line("tt", clock(s[0], true));

    key.className = "key"; key.style.background = `var(${c})`;
    b.textContent = fix(s[i], st.digits) + st.short;

  tip.hidden = false;
  const pw = box.querySelector(".plot").clientWidth, tw = tip.offsetWidth, px = Number(x) * pw / st.W;

function hideAt(id) {

async function admPoll() {
