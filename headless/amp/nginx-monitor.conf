# Telemetry monitor over HTTPS behind the nginx that already serves AMP (certbot site, e.g.
# /etc/nginx/conf.d/<domain>.conf). Paste these two blocks into the `listen 443 ssl` server block, ABOVE `location / {`,
# then: sudo nginx -t && sudo systemctl reload nginx
# The monitor is then at https://<domain>/monitor/ (key as before). Players' games keep pushing to TCP 18780 directly.

    location = /monitor {
        return 301 /monitor/;
    }
    location /monitor/ {
        proxy_pass         http://127.0.0.1:18780/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_buffering    off;
        proxy_read_timeout 60s;
    }
